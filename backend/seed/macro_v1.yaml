# Tesis Macro v1.0 — doc 01 sec. 1 "TESIS MACRO"
# Activación: Abril 2026. Revisión: trimestral o ante evento macro disruptivo.

version: "v1.0"
fase_actual: "fase_1_ofensiva"
postura_capital: "selectiva"
notas: |
  FASE 1 (próximos 3-6 meses): crecimiento moderado con mercado tendiendo a
  máximos. Capex en AI sigue fuerte, tasas elevadas pero estables, conflicto
  geopolítico genera volatilidad puntual pero no disrupción sistémica.
  Ventana ofensiva.

  FASE 2 (segunda mitad del año): transición hacia stagflation. Deuda USA,
  desconfianza creciente en el dólar y presión inflacionaria estructural
  empiezan a pesar. El mercado general se complica pero el ecosistema AI
  y sus proveedores críticos siguen con viento a favor.

  IMPLICANCIA: hay ventana táctica en los próximos meses para construir
  posiciones antes de que el contexto se complique. No es momento de ser
  conservador — es momento de ser selectivo y rápido.

  DRIVERS ESTRUCTURALES (5-10 años):
  - Adopción AI irreversible con demanda masiva en capas sub-priceadas
  - Transición energética y soberanía de minerales críticos
  - Gasto en defensa creciente globalmente sin reversión
  - Biotecnología de precisión con pipeline de aprobaciones acelerado

  RIESGOS A MONITOREAR:
  - Si capex AI desacelera, suppliers sufren primero compresión de múltiplos
  - Monitorear earnings de hyperscalers cada trimestre como señal temprana
  - Varios sectores ya parcialmente priceados — evitar pagar expectativas

  POSTURA DE CAPITAL:
  - Máx 5 posiciones formales + 1 bucket exploratorio
  - Máx 2 por sector, máx 2 por driver macro compartido
  - Cash no tiene mínimo fijo — refleja lectura del mercado
  - Decisiones de cash en alta volatilidad requieren revisión humana
