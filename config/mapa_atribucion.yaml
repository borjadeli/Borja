# config/mapa_atribucion.yaml — atribución manual empresa→cuello (doc 89 §8, pieza 2 del mapa MVP).
#
# POR QUÉ: el tablero agrega XBRL por EMPRESA = economía del ECOSISTEMA, no del CUELLO. Atribuir TODO el revenue
# de una empresa diversificada (ej. COHR $7B) al cuello lo SOBREESTIMA. El peso de pureza corrige. XBRL no da la
# atribución (sin segmentos) → anotación MANUAL en los vínculos clave, con CITA. Lo no anotado = DESCONOCIDA
# (default honesto): no suma al atribuible y baja la cobertura (§8.1).
#
# ⚠ PRIMER PASE (2026-11-20): pesos ESTIMADOS por el ingeniero a partir de la mezcla de segmentos conocida —
# PENDIENTES de validación del curador contra el 10-K (segmento reportado). Son conservadores a propósito.
# Las claves de cuello son los NOMBRES REALES de los nodos en nx_*.
#
# ESQUEMA: peso_pureza (0..1, AUSENTE=DESCONOCIDA) · rol · captura · dependencia · fuente

"Transceptores ópticos 400G/800G/1.6T":
  AAOI:
    peso_pureza: 0.75
    rol: proveedor_critico
    captura: transceptores datacenter (grueso del revenue hoy)
    dependencia: alta
    fuente: "estimación — validar 10-K (Data Center segment ~mayoría de ventas)"
  COHR:
    peso_pureza: 0.18
    rol: proveedor_critico
    captura: transceptores datacom; Coherent es diversificado (láseres/materiales/networking)
    dependencia: media
    fuente: "estimación — validar 10-K (Networking/Datacom vs total ~$5.7B)"

"Láseres EML (InP) para datacom":
  COHR: {peso_pureza: 0.12, rol: proveedor_critico, fuente: "estimación — componentes láser EML, validar 10-K"}
  AAOI: {peso_pureza: 0.10, rol: proveedor_critico, fuente: "estimación — validar 10-K"}

"DSPs ópticos PAM4":
  CRDO: {peso_pureza: 0.15, rol: proveedor_critico, fuente: "estimación — DSP óptico es parte de Connectivity, validar 10-K"}
  CIEN: {peso_pureza: 0.08, rol: integrador, fuente: "estimación — DSP embebido en sistemas, validar 10-K"}

"Manufactura óptica por contrato (EMS de precisión)":
  FN:
    peso_pureza: 0.60
    rol: integrador
    captura: EMS óptico de precisión; márgenes finos, poco pricing power (el caso Fabrinet §8.1)
    dependencia: media
    fuente: "estimación — Optical Communications ~mayoría de ventas, validar 10-K"
  JBL: {peso_pureza: 0.02, rol: integrador, fuente: "estimación — Jabil es EMS gigante diversificado, óptico marginal"}

"Silicon photonics (PICs)":
  GFS: {peso_pureza: 0.03, rol: proveedor_critico, fuente: "estimación — SiPho es nicho de GlobalFoundries"}
  TSEM: {peso_pureza: 0.05, rol: proveedor_critico, fuente: "estimación — foundry SiPho de Tower, nicho"}

"Sustratos compuestos (InP, GaAs, Ge)":
  AXTI: {peso_pureza: 0.70, rol: proveedor_critico, captura: núcleo del negocio de AXT, dependencia: alta,
         fuente: "estimación — sustratos compuestos = core, validar 10-K"}
  COHR: {peso_pureza: 0.04, rol: proveedor_critico, fuente: "estimación — materiales, fracción chica"}

"Galio":
  AXTI: {peso_pureza: 0.12, rol: proveedor_critico, fuente: "estimación — parte de la línea de materiales"}

"Tierras raras (NdPr, Dy, Tb) e imanes":
  MP:   {peso_pureza: 0.90, rol: proveedor_critico, captura: productor integrado NdPr + imanes, dependencia: alta,
         fuente: "estimación — MP Materials es esencialmente tierras raras, validar 10-K"}
  UUUU: {peso_pureza: 0.10, rol: proveedor_critico, fuente: "estimación — Energy Fuels: uranio + REE naciente"}
  USAR: {peso_pureza: 0.50, rol: proveedor_critico, fuente: "estimación — USA Rare Earth, validar 10-K"}

"Semiconductores de potencia SiC":
  WOLF: {peso_pureza: 0.65, rol: proveedor_critico, captura: pure-play SiC, dependencia: alta,
         fuente: "estimación — Wolfspeed centrado en SiC, validar 10-K"}
  ON:   {peso_pureza: 0.12, rol: proveedor_critico, captura: SiC es segmento en crecimiento pero minoritario,
         fuente: "estimación — onsemi SiC fracción del total, validar 10-K"}
  NVTS: {peso_pureza: 0.35, rol: proveedor_critico, fuente: "estimación — Navitas GaN/SiC, validar 10-K"}
  STM:  {peso_pureza: 0.04, rol: proveedor_critico, fuente: "estimación — ST diversificado"}

"Construcción y EPC de datacenters":
  IESC: {peso_pureza: 0.40, rol: integrador, captura: segmento de infraestructura de datacenter en crecimiento,
         fuente: "estimación — IES Holdings, validar 10-K (Communications/Infrastructure)"}
  EME:  {peso_pureza: 0.25, rol: integrador, fuente: "estimación — EMCOR, datacenter una parte"}
  FIX:  {peso_pureza: 0.15, rol: integrador, fuente: "estimación — Comfort Systems, validar 10-K"}
  STRL: {peso_pureza: 0.30, rol: integrador, fuente: "estimación — Sterling e-Infrastructure, validar 10-K"}

"Retimers PCIe/CXL/Ethernet":
  ALAB: {peso_pureza: 0.55, rol: proveedor_critico, fuente: "estimación — Astera Labs core connectivity, validar 10-K"}
  CRDO: {peso_pureza: 0.25, rol: proveedor_critico, fuente: "estimación — retimers parte de Credo, validar 10-K"}
