# IPS — Investment Policy Statement (v2 Fase 4, doc 51 §3B / doc 55).
# El ÚNICO lugar donde el código impone límites duros. Inputs MECÁNICOS solo (precios, pesos, ADV, market
# cap, fechas, clasificación de fuente fija) — nunca un juicio de LLM (doc 55 §4, principio rector).
# El validador usa esto como dry-run tool del PM y como gate final. Versionado + hash en cada decisión.
version: "1.0"
fecha: "2026-10-26"

# --- Límites de cartera (decisiones del operador 2026-10-26; max_posiciones 12→20 en r7a #1) ---
max_posiciones: 20             # r7a #1: 12→20. NO cuenta los ETFs de estacionamiento (ver abajo)
peso_max_nombre: 0.20          # 20% por nombre
peso_min_nombre: 0.05          # PISO 5% por posición (decisión operador 2026-11-24): nada de stubs 1-2% — si la abrís, que pese

# --- IPS por TIERS (P1.3, doc 91 §7 — reemplaza al piso rígido con 4 categorías ECONÓMICAS) ---
# IA1 it.2: la opcionalidad es una categoría distinta, NO un CORE chico → NO hay tier 3-5% (evita que toda posición
# chica sea una excepción al piso). El tier NO da derecho a usar todo su rango: siempre gana el cap más restrictivo
# (liquidez/supervivencia/sector/cuello). Implementado test-driven (18 tests de aceptación en el acumulador).
tiers:
  OPTIONALITY:    {min: 0.015, max: 0.025}  # asimetría alta con incertidumbre material (max 2.5% = half-Kelly, IA2)
  CORE:           {min: 0.05, max: 0.10}   # tesis con margen de seguridad
  HIGH_CONVICTION: {min_exclusive: 0.10, max: 0.15}   # oportunidad excepcional con evidencia robusta
  EXCEPTIONAL:    {min_exclusive: 0.15, max: 0.20}   # concentración extraordinaria
# Tope por ARQUETIPO (IA2, resuelto 2026-11-25): la pieza que más protege el norte — capea cíclicas e infra a 10% y
# PROHÍBE pre-revenue en núcleo (solo opcionalidad). Gana el más restrictivo entre este y el tier/banda/evidencia.
cap_por_arquetipo: {compounder: 0.15, ciclica: 0.10, infra: 0.10, pre_revenue: 0.0}
optionality:
  max_positions: 4             # ~8% agregado / 2.5% por nombre ≈ 3-4 plazas
  max_aggregate_weight: 0.08   # cap AGREGADO (operador 2026-11-25: punto medio IA1 6% / IA2 15%); al tocarlo, se congela
  requires_verified_dossier: true       # excepción al TAMAÑO mínimo, NO a la calidad de evidencia
  requires_economic_justification: true
residual_weights:
  passive_drift: ALLOW_AND_FLAG         # caída pasiva por precio → permitido, se señala, sin operación forzada
  invalid_voluntary_target: REJECT      # reducción voluntaria a peso inválido → REJECT + alternativas (el PM decide)
  invalid_projected_clip: REJECT        # el clip determinista deja un residual voluntario inválido → REJECT
  unexpected_partial_fill: FLAG_AND_REVIEW
  auto_liquidate: false                 # NUNCA liquidación automática gatillada solo por el peso
max_por_sector: 0.30
max_por_cuello: 0.35           # requiere mapa poblado (nx_nodo) — ya está
caja_min: 0.0
caja_max: 1.0                  # puede ir 100% a caja (disciplina sobre actividad)
max_ops_semana: 2              # por SEMANA CALENDARIO (se cuenta desde el ledger, no por decisión)
banda_peso_existente: 0.03     # una posición que derivó sobre el cap se recorta solo si supera cap + banda

# --- Embudo de análisis (doc 64 + decisión del operador sobre earnings) ---
cupo_oportunidad: 6            # deeps por OPORTUNIDAD/semana (barato por score, no por evento) — subido 4→6 (operador 2026-11-24: ampliar la búsqueda)
cupo_forzados: 8               # tope del carril forzado por evento para NO-posiciones (doc 76); rankea por
                               #   prioridad de cuello y arrastra el overflow (las posiciones no cuentan acá)
cupo_gigantes: 2               # gigantes (>market_cap_max) que CAYERON fuerte → se analizan (carril chico)
                               #   (el puente confirma si están baratos). doc 76 + decisión operador
gigantes_comprables: true      # r6 #6 (decisión operador): un gigante analizado SÍ se puede comprar en el paper
peso_max_gigante: 0.10         #   pero con cap propio del 10% (vs 20% normal) — "los grandes, si están baratos"
pre_earnings_top_n: 3          # earnings próximo → deep solo para posiciones + los N mejores candidatos
                               #   (por prioridad de cuello); el resto espera el dato (post-earnings)
dias_earnings_proximo: 10      # "earnings próximo" = a <= N días del evento estimado

# --- Admisibilidad del universo ---
universo_max: 160                   # tope de nombres en el universo (r6 #2). Al llenarse, una alta de discovery
                                    #   ARCHIVA directo al peor no-posición (reemplazo directo; nada espera afuera)
market_cap_min_usd: 150000000       # $150M
market_cap_max_usd: 60000000000     # $60B
adv_min_usd: 0                      # LIQUIDEZ NO ES FILTRO (decisión del operador: entra con poco capital).
                                    #   El pct_adv_max de abajo igual evita tomar una posición mayor que lo
                                    #   que el mercado soporta, así que no hace falta un piso de ADV.
pct_adv_max: 0.10                   # una posición no supera el 10% del ADV

# --- Regla condicional de supervivencia (doc 55 §4.5: el cap vive en el IPS, no por fuera) ---
# Un flag de supervivencia NO resuelto (ni refutado con evidencia ni aceptado como falsador) → el nombre
# cae a REVIEW y su peso resultante no supera este tope. NO es una regla paralela del orquestador.
cap_flag_supervivencia: 0.04

# --- D4: cap DURO por clasificación (doc 80 §H — decisión del operador 2026-11-12, "a duro YA") ---
# SIN bandas core/satélite: el PM sizea LIBRE hasta peso_max_nombre (20%); pondera él el riesgo como PM. El
# ÚNICO techo duro por clase es el extremo especulativo — seguro barato de gestión de riesgo que SÍ gatea en el
# gate (r12 #1): la clasificación EFECTIVA de la ficha limita el tamaño del AUMENTO.
cap_por_clase:
  especulativa: 0.10                  # especulativa ≤ 10% por nombre (DURO)
  watchlist: 0.0                      # watchlist = 0 (no comprable)
# Shadow (informativo al Auditor, NO gatea): sumas por bucket/cluster.
cap_bucket_especulativo: 0.30         # suma de posiciones especulativas ≤ 30% — señal al Auditor
cap_cluster_tematico: 0.40            # suma por cluster temático (cualquier clasificación) ≤ 40% — señal al Auditor
umbral_revenue_recurrente_usd: 50000000   # revenue FY ≥ $50M = "revenue recurrente" (techo D4, r5 item 2)

# --- Concentración por FACTOR común (F4, doc 83 §3) — dependencia económica compartida, no sector/cuello ---
# Exposure_f = Σ peso · carga (cargas 0/0.5/1 que propone el Analista). El gate bloquea los aumentos que cargan
# un factor que supera el cap. Taxonomía CERRADA (propiedad del operador); el Analista solo asigna cargas.
max_por_factor: 0.30                  # cap duro de exposición ponderada a un driver (rango de calibración 25-35%)
taxonomia_factores:                   # ~8 drivers; el Analista elige de acá (1 primario + hasta 2 secundarios)
  - ai_datacenter_capex              # gasto de capital en datacenters de IA (demanda de cómputo/energía)
  - politica_industrial_us           # subsidios/créditos/offtake de agencias US (DoD/DOE) — revertible por elección
  - costo_de_capital                 # tasas / ventana de financiamiento abierta (dilución/refinanciación)
  - precio_commodity                 # precio de un mineral/insumo (NdPr, uranio, cobre…)
  - ciclo_defensa                    # presupuesto de defensa / programas militares
  - demanda_nuclear                  # despliegue de SMR / energía nuclear
  - cadena_semis                     # suministro/demanda de semiconductores
  - espacio_lanzamiento              # cadencia de lanzamientos / contratos espaciales

# --- Reglas de riesgo que ANTES eran "juicio del auditor" y ahora son números (doc 55 §4.4) ---
turnover_max_semana: 0.25      # rotación máxima semanal (suma de |Δpeso|) — CABLEADO: bloquea aumentos
# holding_period_min_dias: SACADO a propósito — gatear ventas por antigüedad contradice el principio
#   risk-off (doc 55 §4.7: las reducciones NUNCA se bloquean). Si se quiere como señal anti-churn, va como
#   objeción medible del auditor (predicción falsable), no como gate duro.

# --- Presupuesto LLM (el ledger de presupuesto lo hace cumplir; acá queda el número) ---
# (doc 80 §H: entrada FUERA de zona COMPRA = permitida + MARCADA + la revisa el Auditor + se mide aparte; el PM
#  sizea LIBRE bajo el IPS, sin cap especial de zona. El cap de 3% se sacó: era determinismo de más y contradecía
#  §H + la directiva del operador — forzaba recortes que el PM no quería.)
presupuesto_usd_mes: 100.0    # subido de 40 → 100 (2026-11-16): fase de construcción, el operador autoriza gastar más
presupuesto_bootstrap_usd: 25.0     # tope PROPIO de la primera pasada del universo (separado del mensual)

# --- Nota macro del OPERADOR (reemplaza al agente Macro, 2026-11-25) ---
# El agente Macro (Opus+web) se SACÓ del circuito: su memo rico se descartaba (solo llegaba el `resumen`),
# re-derivaba un marco que ya es del operador vía el IPS, y empujaba el concepto de `cuello` que el backtest
# refutó (pro-cíclico). El marco macro ahora lo escribís VOS acá: este texto se inyecta en el MISMO punto donde
# entraba el memo (al Analista, al PM y al Auditor). Dejalo "" si no querés dar marco. Parco y concreto.
nota_macro: ""

# --- Estacionamiento en ETFs temáticos (r7a #1) ---
# El residual que NO encuentra nombres con margen de seguridad se aparca acá (ponderado por los clusters del
# mapa), NUNCA en nombres caros para llegar al 90%. La caja alta sigue exigiendo tesis macro. Los ETFs de esta
# lista NO cuentan como posición (max_posiciones) ni como operación (max_ops_semana) y se desarman primero.
estacionamiento:
  activo: true
  etf_default: SPY                      # clusters sin ETF temático → índice amplio
  etfs_por_cluster:                     # cluster del mapa (nx_nodo) → ETF temático de la cartera sombra
    semis: SMH
    semiconductores: SMH
    fotonica: SMH
    fotónica: SMH
    nuclear: URA
    uranio: URA
    energia: URA
    energía: URA
    defensa: ITA
    espacio: ITA
    aeroespacial: ITA
    commodities: COPX
    minerales: COPX
    cobre: COPX

# --- Ficha viva: hurdles y pisos por clase (r9, doc 80 §3 — aprobado por el operador 2026-11-12) ---
# El rendimiento anual MÍNIMO que un nombre debe prometer a su precio de hoy para ser "compra" (hurdle) y la
# pérdida máxima aceptable en el bear como gate (piso; null = sin piso, especulativa la limita el tamaño). De
# acá salen las zonas/gatillos de la ficha; ningún agente escribe un precio. Son PRIORS: las sombras los ajustan.
# r9a #1 (calibración): hurdles BAJADOS (el bear ya está ponderado en E[V] → no doble-castigar, doc 74). El
# piso ahora es PÉRDIDA ESPERADA (prob_bear × pérdida_bear ≤ piso), no peor-caso — arregla la monotonía (mejor
# clase = precio de compra ≥). Especulativa: sin piso, pero exige V_bull ≥ 5× el precio (doc 80 §3).
ficha_hurdles:
  core: 0.12
  satelite: 0.15
  especulativa: 0.20
  watchlist: 0.20
ficha_pisos:                            # pérdida ESPERADA máxima aceptable (prob_bear × pérdida_bear)
  core: 0.35
  satelite: 0.50
  especulativa: null
  watchlist: null
ficha_hurdle_min: 0.08
ficha_bull_min_especulativa: 5.0        # especulativa COMPRA exige además V_bull ≥ 5× el precio

# --- Duro e innegociable ---
ordenes_reales: false          # PROHIBIDO enviar órdenes reales / conectar bróker con escritura

# --- Fuente de la clasificación sector/cuello para los caps de concentración ---
# MECÁNICA: tabla fija, NUNCA un bucket asignado por LLM (doc 55 §4.1). 'nx_nodo' = el mapa poblado en Fase 2
# (cluster/factor_macro); 'gics' = tabla GICS a mano si se necesita el eje bursátil.
clasificacion_fuente: "nx_nodo"
