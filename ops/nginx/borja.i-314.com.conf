# BORJA — vhost nginx: publica el dashboard (127.0.0.1:4151) en https://borja.i-314.com
# Instalar con los 3 comandos de ops/nginx/INSTALAR.md (necesita sudo).
# El cert *.i-314.com de Cloudflare ya cubre este subdominio.

server {
    listen 80;
    listen [::]:80;
    server_name borja.i-314.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name borja.i-314.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # tamaño generoso por si subís/pegás cosas en la consola
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4151;
        proxy_http_version 1.1;

        # WebSocket (la consola /consola lo usa)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # la app setea cookie Secure (COOKIE_SECURE=1)

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;   # la consola/streams pueden ser largos
    }
}
